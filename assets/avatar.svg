<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Circle with Gradient -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>

  <!-- Developer Silhouette / Illustration -->
  <g id="character">
    <!-- Back Hair -->
    <path d="M 60 90 C 55 45, 145 45, 140 90 C 135 115, 65 115, 60 90 Z" fill="url(#hairGrad)" />

    <!-- Shoulders & Hoodie -->
    <path d="M 40 186 C 45 145, 70 135, 100 135 C 130 135, 155 145, 160 186 Z" fill="url(#shirtGrad)" />
    <!-- Hoodie Strings & Neckline -->
    <path d="M 86 137 L 90 165 M 114 137 L 110 165" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 85 136 C 90 148, 110 148, 115 136" fill="none" stroke="#1e3a8a" stroke-width="3"/>

    <!-- Neck -->
    <rect x="88" y="118" width="24" height="22" rx="6" fill="#fbb040" />

    <!-- Face -->
    <ellipse cx="100" cy="94" rx="34" ry="38" fill="#fcd34d" />

    <!-- Hair Front / Bangs -->
    <path d="M 66 82 C 75 60, 125 55, 134 82 C 122 72, 105 74, 98 78 C 90 73, 76 75, 66 82 Z" fill="url(#hairGrad)" />

    <!-- Glasses Frame -->
    <rect x="74" y="86" width="22" height="16" rx="5" fill="none" stroke="#1e1b4b" stroke-width="3.5" />
    <rect x="104" y="86" width="22" height="16" rx="5" fill="none" stroke="#1e1b4b" stroke-width="3.5" />
    <line x1="96" y1="94" x2="104" y2="94" stroke="#1e1b4b" stroke-width="3.5" />
    <line x1="68" y1="92" x2="74" y2="92" stroke="#1e1b4b" stroke-width="3" />
    <line x1="126" y1="92" x2="132" y2="92" stroke="#1e1b4b" stroke-width="3" />

    <!-- Eyes (Behind Glasses) -->
    <circle cx="85" cy="94" r="3" fill="#1e1b4b" />
    <circle cx="115" cy="94" r="3" fill="#1e1b4b" />
    <circle cx="86" cy="93" r="1" fill="#ffffff" />
    <circle cx="116" cy="93" r="1" fill="#ffffff" />

    <!-- Friendly Smile -->
    <path d="M 91 114 Q 100 123 109 114" fill="none" stroke="#b45309" stroke-width="2.8" stroke-linecap="round" />

    <!-- Cheeks Blush -->
    <ellipse cx="78" cy="106" rx="5" ry="3" fill="#f87171" opacity="0.45" />
    <ellipse cx="122" cy="106" rx="5" ry="3" fill="#f87171" opacity="0.45" />

    <!-- Coding Laptop at Bottom -->
    <path d="M 68 185 L 132 185 L 126 170 L 74 170 Z" fill="#94a3b8" />
    <rect x="72" y="168" width="56" height="4" rx="2" fill="#cbd5e1" />
    <circle cx="100" cy="177" r="2.5" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
